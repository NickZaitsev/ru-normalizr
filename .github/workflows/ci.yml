name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run so upstream dependency releases (e.g. num2words, which has no
    # upper bound while tests assert exact output) are caught here, not by users.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # One Windows cell so the primary development OS is exercised in CI.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Sync locked dependencies
        if: github.event_name != 'schedule'
        run: uv sync --frozen

      - name: Refresh num2words for scheduled compatibility check
        if: github.event_name == 'schedule'
        run: |
          uv lock --upgrade-package num2words
          uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        if: runner.os == 'Linux'
        run: uv run pyright

      - name: Test
        run: uv run pytest -q

      - name: Branch coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run pytest -q --cov=src/ru_normalizr --cov-branch --cov-report=term-missing

      - name: Build
        run: uv build
