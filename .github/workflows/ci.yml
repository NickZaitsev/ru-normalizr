name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run so upstream dependency releases (e.g. num2words, which has no
    # upper bound while tests assert exact output) are caught here, not by users.
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Sync locked dependencies
        if: github.event_name != 'schedule'
        run: uv sync --frozen

      - name: Refresh num2words for scheduled compatibility check
        if: github.event_name == 'schedule'
        run: |
          uv lock --upgrade-package num2words
          uv sync --frozen

      - name: Verify compiled morphology backend
        run: uv run python -c "from pymorphy3 import dawg; assert dawg.EXTENSION_AVAILABLE"

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        if: runner.os == 'Linux'
        run: uv run pyright

      - name: Test
        run: uv run pytest -q

      - name: Branch coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run pytest -q --cov=src/ru_normalizr --cov-branch --cov-report=term-missing

      - name: Build
        run: uv build

  wheel-smoke:
    name: Wheel install smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel

      - name: Install wheel without dev dependencies
        run: |
          uv venv --python 3.12 .smoke-venv
          uv pip install --python .smoke-venv/bin/python dist/*.whl

      - name: Run installed CLI
        run: |
          .smoke-venv/bin/python -c "from pymorphy3 import dawg; assert dawg.EXTENSION_AVAILABLE"
          .smoke-venv/bin/ru-normalizr --version
          .smoke-venv/bin/ru-normalizr "тест 123"

  performance:
    name: Performance regression
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Preserve benchmark harness
        run: cp scripts/benchmark.py "$RUNNER_TEMP/benchmark.py"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Checkout base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}

      - name: Benchmark base commit
        run: |
          uv sync --frozen
          uv run python "$RUNNER_TEMP/benchmark.py" \
            --mode tts --case mixed --case number-dense --size 500000 \
            --samples 3 \
            --json "$RUNNER_TEMP/base.json"

      - name: Checkout pull request again
        uses: actions/checkout@v4

      - name: Benchmark and compare pull request
        run: |
          uv sync --frozen
          uv run python scripts/benchmark.py \
            --mode tts --case mixed --case number-dense --size 500000 \
            --samples 3 \
            --compare "$RUNNER_TEMP/base.json" \
            --json "$RUNNER_TEMP/current.json" \
            --max-regression-percent 25

      - name: Upload benchmark metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-metrics
          path: |
            ${{ runner.temp }}/base.json
            ${{ runner.temp }}/current.json
