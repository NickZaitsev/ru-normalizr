name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Validate release
        run: uv run python scripts/dev.py check

      - name: Verify release tag matches package version
        run: uv run python scripts/dev.py check-release-tag

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
