[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ru-normalizr"
version = "1.2.0"
description = "The best open-source Russian text normalization for TTS and NLP: numbers, dates, abbreviations, Roman numerals, CAPS, and Latin-to-Cyrillic transliteration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "NickZaitsev"}]
keywords = ["russian", "normalization", "nlp", "text-processing", "tts"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Natural Language :: Russian",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  # eng_to_ipa не выпускался с 0.0.2 и не следует semver: любой новый выпуск
  # нужно проверять руками на составе словаря IPA, поэтому верхняя граница.
  "eng_to_ipa>=0.0.2,<0.1",
  # num2words меняет формулировки числительных между минорными выпусками —
  # это напрямую ломает эталоны тестов. Границу двигаем осознанно; недельный
  # запуск CI ловит момент, когда её пора поднять.
  "num2words>=0.5.13,<0.6",
  "pymorphy3[fast]>=2.0,<3",
  "pymorphy3-dicts-ru>=2.0,<3",
  "roman>=4.0",
]

[dependency-groups]
dev = [
  "build>=1.0",
  "pyright>=1.1",
  "pytest>=7.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "tomli>=2.0",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/NickZaitsev/ru-normalizr"
Repository = "https://github.com/NickZaitsev/ru-normalizr"
Issues = "https://github.com/NickZaitsev/ru-normalizr/issues"
Changelog = "https://github.com/NickZaitsev/ru-normalizr/blob/main/CHANGELOG.md"

[project.scripts]
ru-normalizr = "ru_normalizr.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

# Пакеты ищутся автоматически: перечисление руками уже однажды означало бы
# потерю нового подпакета в wheel без единой ошибки сборки.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ru_normalizr = ["py.typed", "dictionaries/**/*.dic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "packaging: собирает wheel через `python -m build` (медленно, нужна сеть); в CI запускается в одной ячейке матрицы",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["src", "scripts"]
exclude = ["tests", "**/__pycache__", ".venv", "build", "dist"]
venvPath = "."
venv = ".venv"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist", ".tmp_dist", "ru_normalizr.egg-info", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",  # Длинные кириллические лингвистические таблицы и комментарии regex.
  "RUF001",  # Кириллический текст даёт ложные срабатывания ambiguous-unicode-character-string.
  "RUF002",  # Кириллические docstring дают ложные срабатывания ambiguous-unicode-character-docstring.
  "RUF003",  # Кириллические комментарии дают ложные срабатывания ambiguous-unicode-character-comment.
]
