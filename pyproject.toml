[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ru-normalizr"
version = "0.3.0"
description = "The best open-source Russian text normalization for TTS and NLP: numbers, dates, abbreviations, Roman numerals, CAPS, and Latin-to-Cyrillic transliteration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "NickZaitsev"}]
keywords = ["russian", "normalization", "nlp", "text-processing", "tts"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Natural Language :: Russian",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "eng_to_ipa==0.0.2",
  "num2words>=0.5.13",
  "pymorphy3>=2.0",
  "pymorphy3-dicts-ru>=2.0",
  "roman>=4.0",
]

[dependency-groups]
dev = [
  "build>=1.0",
  "pyright>=1.1",
  "pytest>=7.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/NickZaitsev/ru-normalizr"
Repository = "https://github.com/NickZaitsev/ru-normalizr"
Issues = "https://github.com/NickZaitsev/ru-normalizr/issues"
Changelog = "https://github.com/NickZaitsev/ru-normalizr/blob/main/CHANGELOG.md"

[project.scripts]
ru-normalizr = "ru_normalizr.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ru_normalizr", "ru_normalizr.numerals"]
include-package-data = false

[tool.setuptools.package-data]
ru_normalizr = ["py.typed", "dictionaries/**/*.dic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist", ".tmp_dist", "ru_normalizr.egg-info", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",  # Длинные кириллические лингвистические таблицы и комментарии regex.
  "RUF001",  # Кириллический текст даёт ложные срабатывания ambiguous-unicode-character-string.
  "RUF002",  # Кириллические docstring дают ложные срабатывания ambiguous-unicode-character-docstring.
  "RUF003",  # Кириллические комментарии дают ложные срабатывания ambiguous-unicode-character-comment.
]
